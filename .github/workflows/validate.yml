name: validate-method-catalog
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog
        run: python python/validate_manifest.py
      - name: Smoke-test dependency-light input audit
        run: python python/00_input_audit.py --input data/mock/scrna_counts.csv --output /tmp/input_audit.json
      - name: Smoke-test sample-level summary
        run: python python/08_sample_level_summary.py --scores data/mock/cell_scores.csv --metadata data/mock/scrna_metadata.csv --output /tmp/sample_level_summary.csv
      - name: Smoke-test recent-method manifests
        run: make smoke-method-manifests
      - name: Compile Python templates
        run: python -m compileall -q python
