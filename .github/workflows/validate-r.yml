name: validate-r

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Parse R entrypoints
        shell: bash
        run: |
          Rscript -e 'files <- list.files("R", pattern = "\\.R$", recursive = TRUE, full.names = TRUE); invisible(lapply(files, parse)); cat("Parsed", length(files), "R files\n")'
