name: validate-r

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Parse R entrypoints
        shell: bash
        run: |
          Rscript -e 'files <- list.files("R", pattern = "\\.R$", recursive = TRUE, full.names = TRUE); invisible(lapply(files, parse)); cat("Parsed", length(files), "R files\n")'
      - name: Smoke-test input audit
        shell: bash
        run: |
          Rscript - <<'RS'
          source("R/00_input_audit.R")
          counts <- as.matrix(read.csv("data/mock/scrna_counts.csv", row.names = 1, check.names = FALSE))
          metadata <- read.csv("data/mock/scrna_metadata.csv", stringsAsFactors = FALSE)
          stopifnot(nrow(audit_count_matrix(counts, require_integer = TRUE)) == ncol(counts))
          audit_metadata(metadata, expected_n = ncol(counts), id_column = "cell_id", expected_ids = colnames(counts))
          cat("Input audit smoke test passed\n")
          RS
      - name: Smoke-test sample-level summary
        shell: bash
        run: |
          Rscript - <<'RS'
          source("R/05_sample_level_summary.R")
          scores <- read.csv("data/mock/cell_scores.csv", stringsAsFactors = FALSE)
          metadata <- read.csv("data/mock/scrna_metadata.csv", stringsAsFactors = FALSE)
          result <- summarize_cell_scores(scores, metadata)
          stopifnot(nrow(result) == 4L, all(result$n_cells_used == 2L))
          cat("Sample-level summary smoke test passed\n")
          RS
      - name: Smoke-test PPI/network baseline
        shell: bash
        run: |
          Rscript - <<'RS'
          source("R/06_protein_context_baseline.R")
          edges <- read.delim("data/mock/protein_network.tsv", stringsAsFactors = FALSE)
          result <- ppi_network_baseline(edges)
          stopifnot(nrow(result) == 4L, result$protein[1] == "STAT3")
          cat("PPI/network baseline smoke test passed\n")
          RS
